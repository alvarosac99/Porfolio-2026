<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-label="Un agente montado con Claude Code publica en LinkedIn">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: "Manrope", "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Fondo papel de marca -->
  <rect width="1600" height="700" fill="#faf6f0"/>

  <!-- Trama de puntos sutil -->
  <g fill="#e6ddd0">
    <!-- filas de puntos -->
    <g>
      <circle cx="80"  cy="80"  r="3"/><circle cx="180" cy="80"  r="3"/><circle cx="280" cy="80"  r="3"/><circle cx="1320" cy="80" r="3"/><circle cx="1420" cy="80" r="3"/><circle cx="1520" cy="80" r="3"/>
      <circle cx="80"  cy="620" r="3"/><circle cx="180" cy="620" r="3"/><circle cx="280" cy="620" r="3"/><circle cx="1320" cy="620" r="3"/><circle cx="1420" cy="620" r="3"/><circle cx="1520" cy="620" r="3"/>
    </g>
  </g>

  <!-- ===== Terminal Claude Code (izquierda) ===== -->
  <g>
    <rect x="150" y="185" width="560" height="330" rx="14" fill="#1a1510"/>
    <!-- barra superior -->
    <rect x="150" y="185" width="560" height="46" rx="14" fill="#241d16"/>
    <rect x="150" y="215" width="560" height="16" fill="#241d16"/>
    <circle cx="184" cy="208" r="7" fill="#ff5f56"/>
    <circle cx="210" cy="208" r="7" fill="#ffbd2e"/>
    <circle cx="236" cy="208" r="7" fill="#27c93f"/>
    <text x="690" y="213" text-anchor="end" class="mono" font-size="18" fill="#6b6255">claude code</text>

    <!-- líneas de terminal -->
    <text x="182" y="290" class="mono" font-size="24" fill="#ff7a42">$ <tspan fill="#faf6f0">claude</tspan> <tspan fill="#8f8578">"redacta el post de hoy"</tspan></text>
    <text x="182" y="330" class="mono" font-size="22" fill="#6b6255">generando borrador...</text>
    <text x="182" y="366" class="mono" font-size="22" fill="#6b6255">leyendo memoria: mi voz</text>
    <text x="182" y="402" class="mono" font-size="22" fill="#27c93f">listo, esperando tu ok</text>

    <!-- marca sunburst Claude (terracota) -->
    <g transform="translate(600,440)" stroke="#d97757" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-14"/>
      <line x1="0" y1="34"  x2="0" y2="14"/>
      <line x1="-34" y1="0" x2="-14" y2="0"/>
      <line x1="34" y1="0"  x2="14" y2="0"/>
      <line x1="-24" y1="-24" x2="-10" y2="-10"/>
      <line x1="24" y1="24"  x2="10" y2="10"/>
      <line x1="-24" y1="24" x2="-10" y2="10"/>
      <line x1="24" y1="-24" x2="10" y2="-10"/>
    </g>
  </g>

  <!-- ===== Conector de flujo ===== -->
  <g>
    <line x1="740" y1="350" x2="880" y2="350" stroke="#ff7a42" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
    <path d="M876 336 L900 350 L876 364 Z" fill="#ff7a42"/>
  </g>

  <!-- ===== Tile LinkedIn (derecha) ===== -->
  <g>
    <rect x="930" y="230" width="240" height="240" rx="34" fill="#0a66c2"/>
    <!-- punto de la i -->
    <circle cx="985" cy="300" r="18" fill="#faf6f0"/>
    <!-- palo de la i -->
    <rect x="972" y="330" width="26" height="96" fill="#faf6f0"/>
    <!-- n -->
    <path d="M1018 426 V330 h26 v14 c8,-12 22,-18 36,-18 30,0 44,20 44,52 v48 h-26 v-44 c0,-18 -8,-28 -24,-28 -16,0 -30,10 -30,32 v40 z" fill="#faf6f0"/>
    <text x="1050" y="520" text-anchor="middle" class="mono" font-size="22" fill="#6b6255">se publica solo</text>
  </g>

  <!-- ===== Título ===== -->
  <text x="150" y="118" class="sans" font-size="40" font-weight="800" fill="#1a1510">Un agente escribe. Yo apruebo. LinkedIn publica.</text>
  <text x="1520" y="640" text-anchor="end" class="mono" font-size="20" fill="#6b6255">zenith blog / tech</text>
</svg>
